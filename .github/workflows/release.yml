name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      # Keep the release gate identical to CI, including the Rust renderer tests.
      - uses: dtolnay/rust-toolchain@stable
      - run: bun run install:ci
      - name: Check before versioning or publishing
        run: bun run check
      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run version-packages
          publish-script: bun run release
          create-github-releases: true
        env:
          # @changesets/changelog-github reads PR and author links during `changeset version`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
